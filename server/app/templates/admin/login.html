<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 영수증리뷰 관리자</title>

    <!-- Pretendard Font -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

    <!-- Admin Styles -->
    <link rel="stylesheet" href="{{ url_for('static', path='admin/css/admin.css') }}">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-logo">
                <h1><span>영수증</span>리뷰</h1>
            </div>

            <p class="login-title">점주 관리자 로그인</p>

            {% if error %}
            <div style="background: #f8d7da; color: #721c24; padding: 12px 16px; border-radius: 6px; margin-bottom: 20px; font-size: 14px;">
                {{ error }}
            </div>
            {% endif %}

            <form method="post" action="{{ url_for('admin_login') }}">
                <div class="form-group">
                    <label class="form-label" for="login_id">아이디</label>
                    <input type="text" id="login_id" name="login_id" class="form-input"
                           placeholder="아이디를 입력하세요" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">비밀번호</label>
                    <input type="password" id="password" name="password" class="form-input"
                           placeholder="비밀번호를 입력하세요" required autocomplete="current-password">
                </div>

                <div class="form-group" style="margin-top: 32px;">
                    <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
                        로그인
                    </button>
                </div>
            </form>

            <div style="text-align: center; margin-top: 24px; font-size: 13px; color: #6c757d;">
                계정이 없으신가요? <a href="mailto:support@placemaster.co.kr" style="color: #03C75A;">문의하기</a>
            </div>
        </div>
    </div>
</body>
</html>
