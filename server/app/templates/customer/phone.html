{% extends "customer/base.html" %}

{% block title %}전화번호 입력{% endblock %}

{% block content %}
<!-- 진행 상태 -->
<div class="progress-bar">
    <div class="progress-bar__step active"></div>
    <div class="progress-bar__step"></div>
    <div class="progress-bar__step"></div>
</div>

<!-- 헤더 -->
<div class="header">
    <h1 class="header__store-name">{{ store.name }}</h1>
    <p class="header__subtitle">리뷰 작성하고 혜택 받으세요</p>
</div>

<!-- 혜택 배너 -->
<div class="benefit-banner slide-up">
    <div class="benefit-banner__icon">🎁</div>
    <p class="benefit-banner__text">{{ store.settings.benefit_text or "리뷰 작성 시 특별 혜택 제공!" }}</p>
</div>

<!-- 에러 메시지 -->
<div class="error-message" id="errorMessage"></div>

<!-- 전화번호 입력 -->
<div class="card card--elevated">
    <div class="input-group">
        <label class="input-group__label" for="phoneInput">휴대폰 번호</label>
        <input
            type="tel"
            id="phoneInput"
            class="input-group__field"
            placeholder="010-0000-0000"
            inputmode="numeric"
            autocomplete="tel"
            maxlength="13"
        >
        <p class="input-group__hint">하이픈(-)은 자동으로 입력됩니다</p>
    </div>
</div>

<!-- 동의 체크 -->
<div class="checkbox-group">
    <label class="checkbox">
        <input type="checkbox" id="privacyAgree" class="checkbox__input" checked>
        <div class="checkbox__content">
            <span class="checkbox__label checkbox__label--required">개인정보 수집·이용 동의</span>
            <p class="checkbox__description">
                서비스 제공을 위해 휴대폰 번호를 수집합니다.
                <a href="#" class="checkbox__link" onclick="showPrivacyPolicy(); return false;">전문 보기</a>
            </p>
        </div>
    </label>

    <label class="checkbox">
        <input type="checkbox" id="marketingAgree" class="checkbox__input" checked>
        <div class="checkbox__content">
            <span class="checkbox__label checkbox__label--optional">마케팅 정보 수신 동의</span>
            <p class="checkbox__description">
                매장의 이벤트, 할인 정보를 받아보실 수 있습니다.
                <a href="#" class="checkbox__link" onclick="showMarketingTerms(); return false;">전문 보기</a>
            </p>
        </div>
    </label>
</div>

<!-- 제출 버튼 -->
<button type="button" id="submitPhone" class="btn btn--primary btn--large btn--full" disabled>
    다음
</button>

<div class="footer">
    <p class="footer__text">© {{ store.name }} · Powered by 영수증리뷰</p>
</div>
{% endblock %}

{% block scripts %}
<script>
function showPrivacyPolicy() {
    alert('개인정보 수집·이용 동의\n\n수집항목: 휴대폰 번호\n수집목적: 리뷰 이벤트 참여 확인, 혜택 제공\n보유기간: 수집일로부터 1년\n\n동의를 거부할 권리가 있으며, 동의 거부 시 서비스 이용이 제한될 수 있습니다.');
}

function showMarketingTerms() {
    alert('마케팅 정보 수신 동의\n\n수신항목: 매장 이벤트, 할인 정보, 신메뉴 안내\n수신방법: 문자메시지(SMS/LMS)\n\n동의를 거부하셔도 서비스 이용이 가능합니다.\n수신 동의 후에도 언제든 거부할 수 있습니다.');
}
</script>
{% endblock %}
