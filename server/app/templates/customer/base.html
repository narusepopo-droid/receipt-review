<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#03C75A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="format-detection" content="telephone=no">

    <title>{% block title %}영수증리뷰{% endblock %} - {{ store.name }}</title>

    <link rel="stylesheet" href="/static/css/customer.css?v=2">

    {% block head %}{% endblock %}
</head>
<body>
    <div class="page">
        <div class="container fade-in">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script>
        window.STORE_CODE = {{ store.store_code | tojson }};
        window.TABLE_NO = {{ table_no | tojson }};
        window.NAVER_REVIEW_URL = {{ (store.naver_review_url or "") | tojson }};
        window.SESSION_ID = {{ (session_id or "") | tojson }};
    </script>
    <script src="/static/js/customer.js?v=3"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
