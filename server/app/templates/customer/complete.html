{% extends "customer/base.html" %}

{% block title %}리뷰 완료{% endblock %}

{% block content %}
<!-- 완료 아이콘 -->
<div class="completion">
    <div class="completion__icon">✓</div>
    <h1 class="completion__title">리뷰 등록 완료!</h1>
    <p class="completion__subtitle">{{ store.name }}에 리뷰를 남겨주셔서 감사합니다</p>
</div>

<!-- 혜택 안내 -->
<div class="benefit-banner">
    <div class="benefit-banner__icon">🎁</div>
    <p class="benefit-banner__text">{{ store.settings.benefit_text or "직원에게 이 화면을 보여주세요!" }}</p>
</div>

<!-- 직원 확인 안내 -->
<div class="card" style="text-align: center; margin-top: 24px;">
    <p style="font-size: 18px; font-weight: 600; color: var(--color-text); margin-bottom: 8px;">
        직원 확인 후 혜택을 받으세요
    </p>
    <p style="font-size: 14px; color: var(--color-text-secondary);">
        이 화면을 직원에게 보여주시면 됩니다
    </p>
</div>

<div class="footer">
    <p class="footer__text">© {{ store.name }} · Powered by 영수증리뷰</p>
</div>
{% endblock %}
