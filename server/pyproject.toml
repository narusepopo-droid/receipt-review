[project]
name = "receipt-review-server"
version = "0.1.0"
description = "영수증리뷰 서버"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pillow>=10.2.0",
    "qrcode[pil]>=7.4.0",
    "apscheduler>=3.10.0",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.0",
    "bcrypt>=4.1.0",
    "cryptography>=42.0.0",
    "httpx>=0.26.0",
    "psycopg2-binary>=2.9.0",
    "asyncpg>=0.29.0",
    "python-jose[cryptography]>=3.3.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
